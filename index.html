<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arkanoid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="hud">
      <div class="hud-item">
        <span class="label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="label">LEVEL</span>
        <span id="level">1</span>
      </div>
      <div class="hud-item">
        <span class="label">POWER</span>
        <span id="power">--</span>
      </div>
      <div class="hud-item">
        <span class="label">LIVES</span>
        <span id="lives" class="lives" role="img" aria-label="3 lives">
          <span class="life on"></span>
          <span class="life on"></span>
          <span class="life on"></span>
        </span>
      </div>
    </header>
    <div class="stage">
      <canvas id="game" width="800" height="600" tabindex="0"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-title">ARKANOID</p>
        <p id="overlay-msg">Press Space or click to start</p>
      </div>
    </div>
  </div>
  <script src="assets/spritesheet.js"></script>
  <script src="levels.js"></script>
  <script src="powerups.js"></script>
  <script src="game.js"></script>
</body>
</html>
